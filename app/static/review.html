
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Transaction Review</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #f4f6f8;
            color: #17212b;
            font-family: system-ui, sans-serif;
        }

        header {
            background: white;
            border-bottom: 1px solid #ddd;
            padding: 20px 5%;
        }

        header h1 { margin: 0; font-size: 24px; }

        main {
            width: 95%;
            max-width: 1800px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .panel {
            background: white;
            border: 1px solid #e0e4e8;
            border-radius: 12px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 1250px;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 13px;
            border-bottom: 1px solid #edf0f2;
        }

        th {
            font-size: 12px;
            color: #667085;
            text-transform: uppercase;
        }

        td { font-size: 14px; }

        select, button {
            font: inherit;
            border-radius: 6px;
            padding: 8px 10px;
        }

        select {
            border: 1px solid #d0d5dd;
            background: white;
            max-width: 190px;
        }

        button {
            border: 1px solid #d0d5dd;
            background: white;
            cursor: pointer;
        }

        button.primary {
            background: #087f7b;
            border-color: #087f7b;
            color: white;
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .muted { color: #667085; font-size: 12px; }
        .amount { font-variant-numeric: tabular-nums; }

        #message {
            min-height: 24px;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .error { color: #b42318; }
        .success { color: #067647; }

        #transactionBody td:nth-child(3) {
            min-width: 180px;
            max-width: 280px;
            overflow-wrap: anywhere;
        }

        #transactionBody td:nth-child(4) {
            min-width: 170px;
            max-width: 220px;
            overflow-wrap: anywhere;
        }

        #transactionBody td:nth-child(7) {
            min-width: 170px;
        }

        #transactionBody td:nth-child(9) {
            min-width: 125px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Personal Finance Automation</h1>
        <div class="muted">Transaction Review</div>
    </header>

    <main>
        <div class="toolbar">
            <div class="actions">
                <label for="monthFilter">Month:</label>
                <select id="monthFilter">
                    <option value="2026-10">October 2026</option>
                    <option value="2026-09">September 2026</option>
                    <option value="2026-08">August 2026</option>
                    <option value="2026-07">July 2026</option>
                    <option value="">All Months</option>
                </select>
                <label for="statusFilter">Show:</label>
                <select id="statusFilter">
                    <option value="pending">Pending Review</option>
                    <option value="ready">Approved</option>
                    <option value="synced">Synced</option>
                    <option value="excluded">Excluded</option>
                    <option value="all">All Transactions</option>
                </select>
            </div>

            <div class="actions">
                <span id="selectedCount">0 selected</span>
                <button id="holdButton" disabled>Hold</button>
                <button id="excludeButton" disabled>Exclude Selected</button>
                <button id="approveButton" class="primary" disabled>
                    Approve Selected
                </button>
            </div>
        </div>

        <div id="message"></div>

        <div class="panel">
            <table>
                <thead>
                    <tr>
                        <th><input type="checkbox" id="selectAll"></th>
                        <th>Date</th>
                        <th>Merchant</th>
                        <th>Account</th>
                        <th>Amount</th>
                        <th>Type</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="transactionBody"></tbody>
            </table>
        </div>

        <section style="margin-top: 32px;">
            <div class="toolbar">
                <div>
                    <h2 style="margin: 0;">Plaid Conflicts</h2>
                    <p class="muted">
                        Bank updates requiring manual review
                    </p>
                </div>

                <button id="refreshConflicts">
                    Refresh Conflicts
                </button>
            </div>

            <div class="panel">
                <table>
                    <thead>
                        <tr>
                            <th>Transaction</th>
                            <th>Change</th>
                            <th>Stored</th>
                            <th>New Bank Data</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="conflictsBody">
                        <tr>
                            <td colspan="5">Loading conflicts...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const CATEGORIES = [
            "Food & Groceries",
            "Utilities",
            "Subscriptions",
            "Entertainment",
            "Shopping",
            "Savings"
        ];

        const selected = new Set();
        let transactions = [];

        const body = document.getElementById("transactionBody");
        const filter = document.getElementById("statusFilter");

        function showMessage(text, error = false) {
            const el = document.getElementById("message");
            el.textContent = text;
            el.className = error ? "error" : "success";
        }

        async function api(url, options = {}) {
            const response = await fetch(url, options);

            if (!response.ok) {
                let message = `Request failed (${response.status})`;
                try {
                    const data = await response.json();
                    message = String(data.detail || message);
                } catch {}
                throw new Error(message);
            }

            return response.json();
        }

        function makeSelect(options, value) {
            const select = document.createElement("select");

            options.forEach(option => {
                const element = document.createElement("option");
                element.value = option;
                element.textContent = option || "Uncategorized";
                select.appendChild(element);
            });

            select.value = value || "";
            return select;
        }

        function updateButtons() {
            document.getElementById("selectedCount").textContent =
                `${selected.size} selected`;

            const selectedRows = transactions.filter(t => selected.has(t.id));
            const hasSelection = selectedRows.length > 0;

            document.getElementById("approveButton").disabled =
                !hasSelection || selectedRows.some(t => t.status === "synced");

            document.getElementById("holdButton").disabled =
                !hasSelection || selectedRows.some(t => t.status === "synced");

            document.getElementById("excludeButton").disabled =
                !hasSelection || selectedRows.some(
                    t => t.status === "synced" ||
                        t.status === "excluded"
                );
        }

        function formatAmount(transaction) {
            const value = transaction.amount_cents / 100;

            if (transaction.transaction_type === "income") {
                return `+$${Math.abs(value).toFixed(2)}`;
            }

            if (transaction.transaction_type === "expense" && value < 0) {
                return `-$${Math.abs(value).toFixed(2)} (Refund)`;
            }

            return `$${Math.abs(value).toFixed(2)}`;
        }

        function renderTransactions() {
            body.replaceChildren();

            for (const transaction of transactions) {
                const tr = document.createElement("tr");

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.checked = selected.has(transaction.id);
                checkbox.disabled = transaction.status === "synced";
                checkbox.onchange = () => {
                    if (checkbox.checked) selected.add(transaction.id);
                    else selected.delete(transaction.id);
                    updateButtons();
                };

                const typeSelect = makeSelect(
                    ["expense", "income", "transfer"],
                    transaction.transaction_type
                );

                const categorySelect = makeSelect(
                    ["", ...CATEGORIES],
                    transaction.category
                );

                // Only expenses have a budget category. Incoming transfers
                // can optionally select a category for the Reimbursement action.
                const categoryCell = document.createElement("div");
                const categoryPlaceholder = document.createElement("span");
                categoryPlaceholder.textContent = "—";
                categoryPlaceholder.className = "muted";

                function toggleCategory() {
                    const isExpense = typeSelect.value === "expense";
                    const isIncomingTransfer =
                        typeSelect.value === "transfer" &&
                        transaction.amount_cents < 0;

                    categoryCell.replaceChildren();

                    if (isExpense || isIncomingTransfer) {
                        categorySelect.disabled =
                            transaction.status === "synced" ||
                            transaction.status === "excluded";
                        categorySelect.options[0].textContent =
                            isIncomingTransfer
                                ? "Reimbursement category…"
                                : "Uncategorized";
                        categoryCell.appendChild(categorySelect);
                    } else {
                        categorySelect.disabled = true;
                        categoryCell.appendChild(categoryPlaceholder);
                    }
                }

                typeSelect.onchange = toggleCategory;
                toggleCategory();

                const saveButton = document.createElement("button");
                saveButton.textContent = "Save";
                saveButton.disabled = transaction.status === "synced";

                saveButton.onclick = async () => {
                    saveButton.disabled = true;
                    try {
                        await api(
                            `/api/review/transactions/${transaction.id}`,
                            {
                                method: "PATCH",
                                headers: {"Content-Type": "application/json"},
                                body: JSON.stringify({
                                    transaction_type: typeSelect.value,
                                    category: typeSelect.value === "expense"
                                        ? (categorySelect.value || null)
                                        : null
                                })
                            }
                        );

                        showMessage("Transaction updated.");
                        await loadTransactions();
                    } catch (error) {
                        showMessage(error.message, true);
                        saveButton.disabled = false;
                    }
                };


                const actionContainer = document.createElement("div");
                actionContainer.style.display = "flex";
                actionContainer.style.gap = "6px";
                actionContainer.style.flexWrap = "wrap";

                actionContainer.appendChild(saveButton);

                if (
                    transaction.amount_cents < 0 &&
                    transaction.transaction_type !== "income" &&
                    transaction.status !== "synced" &&
                    transaction.status !== "excluded"
                ) {
                    const reimbursementButton = document.createElement("button");

                    reimbursementButton.textContent = "Reimbursement";

                    reimbursementButton.onclick = async () => {
                        const category = categorySelect.value;

                        if (!category) {
                            showMessage(
                                "Select an expense category first.",
                                true
                            );
                            return;
                        }

                        reimbursementButton.disabled = true;

                        try {
                            await api(
                                `/api/review/transactions/${transaction.id}/reimbursement`,
                                {
                                    method: "POST",
                                    headers: {
                                        "Content-Type": "application/json"
                                    },
                                    body: JSON.stringify({ category })
                                }
                            );

                            showMessage(
                                "Marked as reimbursement. Approve to sync."
                            );

                            await loadTransactions();

                        } catch (error) {
                            showMessage(error.message, true);
                            reimbursementButton.disabled = false;
                        }
                    };

                    actionContainer.appendChild(reimbursementButton);
                }


                const cells = [
                    checkbox,
                    transaction.date,
                    transaction.description,
                    transaction.account_id,
                    formatAmount(transaction),
                    typeSelect,
                    categoryCell,
                    transaction.status,
                    actionContainer
                ];

                cells.forEach(value => {
                    const td = document.createElement("td");

                    if (value instanceof HTMLElement) {
                        td.appendChild(value);
                    } else {
                        td.textContent = String(value);
                    }

                    tr.appendChild(td);
                });

                body.appendChild(tr);
            }

            if (transactions.length === 0) {
                const tr = document.createElement("tr");
                const td = document.createElement("td");
                td.colSpan = 9;
                td.textContent = "No transactions found.";
                tr.appendChild(td);
                body.appendChild(tr);
            }

            updateButtons();
        }

        async function loadTransactions() {
            const status = encodeURIComponent(filter.value);
            const month = encodeURIComponent(
                document.getElementById("monthFilter").value
            );

            transactions = await api(
                `/api/review/transactions?status=${status}&month=${month}`
            );

            selected.clear();
            document.getElementById("selectAll").checked = false;
            renderTransactions();
        }

        async function bulkAction(action) {
            if (!selected.size) return;

            const buttonIds = {
                approve: "approveButton",
                hold: "holdButton",
                exclude: "excludeButton"
            };

            const button = document.getElementById(buttonIds[action]);

            button.disabled = true;

            try {
                const result = await api(`/api/review/${action}`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ids: [...selected]})
                });

                showMessage(
                    `${result.approved ?? result.held ?? result.excluded} transactions processed.`
                );

                await loadTransactions();
            } catch (error) {
                showMessage(error.message, true);
                updateButtons();
            }
        }

        document.getElementById("approveButton").onclick =
            () => bulkAction("approve");

        document.getElementById("holdButton").onclick =
            () => bulkAction("hold");

        document.getElementById("excludeButton").onclick =
            () => bulkAction("exclude");

        document.getElementById("selectAll").onchange = event => {
            selected.clear();

            if (event.target.checked) {
                transactions.forEach(t => {
                    if (t.status !== "synced") selected.add(t.id);
                });
            }

            renderTransactions();
        };

        filter.onchange = () => {
            loadTransactions().catch(error =>
                showMessage(error.message, true)
            );
        };

        loadTransactions().catch(error =>
            showMessage(error.message, true)
        );

        
        function money(cents) {
            if (cents === null || cents === undefined) {
                return "—";
            }

            const amount = Number(cents) / 100;
            return `${amount < 0 ? "-" : ""}$${Math.abs(amount).toFixed(2)}`;
        }

        async function loadConflicts() {
            const tbody = document.getElementById("conflictsBody");
            tbody.replaceChildren();

            try {
                const conflicts = await api("/api/conflicts");

                if (conflicts.length === 0) {
                    const row = tbody.insertRow();
                    const cell = row.insertCell();
                    cell.colSpan = 5;
                    cell.textContent = "No unresolved Plaid conflicts.";
                    return;
                }

                for (const conflict of conflicts) {
                    const row = tbody.insertRow();

                    const newData = conflict.new_data || {};
                    const oldData = conflict.old_data || {};

                    const details = [
                        conflict.description || oldData.description || "Unknown",
                        conflict.change_type,
                        `${money(oldData.amount_cents)} (${oldData.date || "—"})`,
                        conflict.change_type === "removed"
                            ? "Removed by Plaid"
                            : `${money(newData.amount_cents)} (${newData.date || "—"})`,
                    ];

                    for (const detail of details) {
                        const cell = row.insertCell();
                        cell.textContent = detail;
                    }

                    const actionCell = row.insertCell();

                    function addButton(label, action) {
                        const button = document.createElement("button");
                        button.textContent = label;
                        button.style.margin = "3px";

                        button.onclick = async () => {
                            let confirmed;

                            if (action === "confirm_reconciled") {
                                confirmed = confirm(
                                    "Have you manually reconciled this " +
                                    "transaction in Google Sheets?"
                                );
                            } else {
                                confirmed = confirm(
                                    `${label} for ${conflict.description}?`
                                );
                            }

                            if (!confirmed) return;

                            button.disabled = true;

                            try {
                                await api(
                                    `/api/conflicts/${conflict.id}/resolve`,
                                    {
                                        method: "POST",
                                        headers: {
                                            "Content-Type": "application/json"
                                        },
                                        body: JSON.stringify({action})
                                    }
                                );

                                showMessage("Conflict resolved.");
                                await loadConflicts();
                                await loadTransactions();

                            } catch (error) {
                                showMessage(error.message, true);
                                button.disabled = false;
                            }
                        };

                        actionCell.appendChild(button);
                    }

                    if (conflict.status === "synced") {
                        addButton(
                            "Confirm Reconciled",
                            "confirm_reconciled"
                        );
                    } else {
                        addButton("Accept Plaid", "accept_plaid");
                        addButton("Keep Existing", "keep_existing");
                    }
                }

            } catch (error) {
                showMessage(error.message, true);
            }
        }

        document.getElementById("refreshConflicts").onclick =
            loadConflicts;

        loadConflicts();

        document.getElementById("monthFilter").onchange = () => {
            loadTransactions().catch(error =>
                showMessage(error.message, true)
            );
        };

    </script>
</body>
</html>
